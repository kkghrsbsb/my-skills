name: Deploy mdBook site to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "book.toml"
      - "theme/**"
      - "mermaid*.js"
      - "mermaid*.css"
      - ".github/workflows/mdbook.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.5.4
      MDBOOK_KATEX_VERSION: 0.10.0
      MDBOOK_MERMAID_VERSION: 0.17.0
    steps:
      - uses: actions/checkout@v4

      - name: Restore mdBook tools
        id: cache-mdbook-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-katex
            ~/.cargo/bin/mdbook-mermaid
          key: mdbook-tools-${{ runner.os }}-${{ runner.arch }}-v1-${{ env.MDBOOK_VERSION }}-${{ env.MDBOOK_KATEX_VERSION }}-${{ env.MDBOOK_MERMAID_VERSION }}

      - name: Install Rust and mdBook tools
        if: steps.cache-mdbook-tools.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          cargo install --version "${MDBOOK_VERSION}" mdbook --locked
          cargo install --version "${MDBOOK_KATEX_VERSION}" mdbook-katex --locked
          cargo install --version "${MDBOOK_MERMAID_VERSION}" mdbook-mermaid --locked

      - name: Add mdBook tools to PATH
        shell: bash
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/mdbook" --version
          "$HOME/.cargo/bin/mdbook-katex" --version
          "$HOME/.cargo/bin/mdbook-mermaid" --version

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with mdBook
        shell: bash
        run: |
          set -euo pipefail
          mdbook build
          test -f book/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
